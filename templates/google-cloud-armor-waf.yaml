# google-cloud-armor-waf.yaml
# Declarative Google Cloud Armor Security Policy Baseline
# Project: greenfield-migration-prod-109
apiVersion: compute.gcp.security/v1
kind: SecurityPolicy
metadata:
  name: enterprise-cloud-armor-waf-policy
  description: "Enterprise WAF and DDoS mitigation policy"
spec:
  rules:
    - priority: 2147483647
      action: "throttle"
      description: "Default rate limiting rule"
      match:
        versionedExpr: SRC_IPS_V1
        config:
          srcIpRanges:
            - "*"
      rateLimitOptions:
        conformAction: "allow"
        exceedAction: "deny(429)"
        rateLimitThreshold:
          count: 1000
          intervalSec: 60
        enforceOnKey: "IP"
    - priority: 1000
      action: "deny(403)"
      description: "Mitigate SQL Injection attacks"
      match:
        expr:
          expression: "evaluatePreconfiguredExpr('sqli-v33-stable')"
    - priority: 1010
      action: "deny(403)"
      description: "Mitigate Cross-Site Scripting attacks"
      match:
        expr:
          expression: "evaluatePreconfiguredExpr('xss-v33-stable')"
    - priority: 1020
      action: "deny(403)"
      description: "Mitigate Local File Inclusion attacks"
      match:
        expr:
          expression: "evaluatePreconfiguredExpr('lfi-v33-stable')"

